version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/supplysync
      - MODEL_PATH=backend/saved_models
      - LEAD_TIME_DAYS=7
      - SERVICE_LEVEL=0.95
      - HOLDING_COST=0.2
      - STOCKOUT_COST=1.0
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      - mongo
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
