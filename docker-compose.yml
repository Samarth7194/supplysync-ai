services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supplysync
      POSTGRES_USER: supplysync
      POSTGRES_PASSWORD: supplysync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplysync -d supplysync"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/saved_models
      - DATABASE_URL=postgresql+psycopg2://supplysync:supplysync@db:5432/supplysync
    volumes:
      # Mount backend source so local edits hot-reload.
      - ./backend:/app
      # Mount the dataset at /data (read-only) so DataService's walk-up
      # lookup finds data/raw/online_retail_II.csv and
      # data/processed/daily_demand.parquet without shadowing backend/data/
      # (which holds cached_kpis.json).
      - ./data:/data:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if r.status==200 else 1)\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
