[alembic]
script_location = alembic
prepend_sys_path = .

# Runtime migrations read DATABASE_URL through backend/src/config/database.py.
# This placeholder keeps Alembic happy when commands inspect the config.
sqlalchemy.url = sqlite:///data/supplysync.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
